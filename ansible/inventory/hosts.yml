---
# ansible/inventory/hosts.yml
# Заполни IP адреса после terraform apply

all:
  children:
    windows:
      hosts:
        win-srv-01:
          ansible_host: 192.168.9.90   # заменить на реальный IP из terraform output
        win-srv-02:
          ansible_host: 192.168.9.91   # заменить на реальный IP из terraform output
      vars:
        # WinRM подключение (вместо SSH как у Linux)
        ansible_user: Administrator
        ansible_password: "{{ vault_win_password }}"   # из ansible vault
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
        ansible_winrm_operation_timeout_sec: 120
        ansible_winrm_read_timeout_sec: 150
