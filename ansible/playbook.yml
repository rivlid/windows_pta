---
# ansible/playbook.yml
# Базовая настройка Windows серверов после деплоя

- name: Configure Windows servers
  hosts: windows
  gather_facts: true

  # Ждём пока VM полностью загрузится и WinRM поднимется
  pre_tasks:
    - name: Wait for WinRM to be available
      wait_for_connection:
        delay: 30
        timeout: 600

    - name: Gather facts
      setup:

  roles:
    - windows-base
